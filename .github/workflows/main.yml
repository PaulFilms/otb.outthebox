name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OTB Web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.3
          package_json_file: OTB Web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: OTB Web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Compilar con Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Falta la variable SUPABASE_URL en Settings > Secrets and variables > Actions > Variables (nivel de repositorio)."
            missing=1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Falta el secreto SUPABASE_ANON_KEY en Settings > Secrets and variables > Actions > Secrets (nivel de repositorio)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: OTB Web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
